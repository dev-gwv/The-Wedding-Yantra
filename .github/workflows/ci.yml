name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_API_URL: https://api.weddingyantra.com

  api-smoke:
    name: API tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wy
          POSTGRES_PASSWORD: wy
          POSTGRES_DB: wy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wy -d wy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@wedding-yantra/api...
      - name: Create test database
        run: PGPASSWORD=wy psql -h 127.0.0.1 -U wy -d wy -c "CREATE DATABASE wy_test"
      - name: Unit tests (shared business rules)
        run: pnpm --filter @wedding-yantra/core test
      - name: API integration tests (auth, teams, tenant isolation)
        run: pnpm --filter @wedding-yantra/api test
        env:
          TEST_DATABASE_URL: postgres://wy:wy@127.0.0.1:5432/wy_test
      - name: Migrations, sign-in flow, restart idempotency
        run: bash scripts/api-smoke.sh
        env:
          DATABASE_URL: postgres://wy:wy@127.0.0.1:5432/wy

  docker:
    name: API image & compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.db-access.yml config --quiet
          # Guard rail: the prod file must never publish host ports.
          if docker compose -f docker-compose.prod.yml config --format json | jq -e '[.services[] | select(.ports)] | length > 0' >/dev/null; then
            echo "::error::docker-compose.prod.yml publishes host ports; this is forbidden on the shared VPS"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: wedding-yantra-api:ci
          cache-from: type=gha,scope=wedding-yantra-api
          cache-to: type=gha,mode=max,scope=wedding-yantra-api
