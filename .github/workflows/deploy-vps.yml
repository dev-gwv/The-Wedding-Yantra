name: Deploy API to VPS

# Deploys ONLY the Wedding Yantra backend stack. Every remote command is scoped
# to $VPS_APP_DIR and the compose project "wedding-yantra"; nothing here touches
# other containers, networks or volumes on the host.
#
# Required repository secrets:
#   VPS_HOST          e.g. 203.0.113.10
#   VPS_USER          non-root user in the `docker` group, e.g. deploy
#   VPS_SSH_KEY       private key (ed25519) whose public half is in ~/.ssh/authorized_keys
#   VPS_KNOWN_HOSTS   output of: ssh-keyscan -p <port> <host>
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   API_PUBLIC_URL    public HTTPS base URL of the API, used for the smoke test,
#                     e.g. https://api.weddingyantra.com or https://api.203-0-113-10.sslip.io
#   VPS_PORT          optional, default 22
#   VPS_APP_DIR       optional, default /opt/wedding-yantra
#
# Until VPS_HOST is set, the deploy job is skipped (not failed).

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/types/**"
      - "packages/core/**"
      - "docker-compose.prod.yml"
      - ".dockerignore"
      - "infra/backup/**"
      - "scripts/api-smoke.sh"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

# Never run two deploys at once; don't cancel one mid-flight either.
concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_PORT: ${{ vars.VPS_PORT || '22' }}
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/wedding-yantra' }}
  API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}

jobs:
  verify:
    name: Verify API builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wy
          POSTGRES_PASSWORD: wy
          POSTGRES_DB: wy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wy -d wy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VPS secrets are not set yet; the deploy job will be skipped. See docs/DEPLOYMENT.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build --filter=@wedding-yantra/api...
      - name: Smoke test against real Postgres (migrations must apply cleanly)
        run: bash scripts/api-smoke.sh
        env:
          DATABASE_URL: postgres://wy:wy@127.0.0.1:5432/wy

  deploy:
    name: Deploy to VPS
    needs: verify
    if: needs.verify.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${HOST}
            User ${USER_NAME}
            Port ${VPS_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Sync source to the Wedding Yantra directory only
        run: |
          ssh vps "mkdir -p '${VPS_APP_DIR}'"
          # --delete keeps the dir identical to the repo, but excluded paths
          # (.env, backups) are protected from deletion.
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.turbo/' \
            --exclude '.next/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude 'backups/' \
            ./ "vps:${VPS_APP_DIR}/"

      - name: Build and roll out (project-scoped)
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -o pipefail
          # The script travels over ssh's stdin (`bash -s`). It is wrapped in main(), so bash reads
          # all of it before running anything, and main runs with stdin from /dev/null, so no
          # command inside (e.g. `docker compose exec`) can swallow the rest of the script.
          # The final WY_DEPLOY_COMPLETE line proves the script really reached the end.
          ssh vps "APP_VERSION='${APP_VERSION}' VPS_APP_DIR='${VPS_APP_DIR}' bash -s" <<'REMOTE' | tee /tmp/deploy.log
          set -euo pipefail
          main() {
          cd "$VPS_APP_DIR"

          COMPOSE="docker compose -p wedding-yantra -f docker-compose.prod.yml"

          # ---- Preflight -----------------------------------------------------
          test -f .env || { echo "::error::$VPS_APP_DIR/.env is missing (copy .env.example and fill it in)"; exit 1; }
          # Read just this one key; never `source` .env (compose parses it itself).
          PROXY_NETWORK="$(sed -n 's/^PROXY_NETWORK=//p' .env | tail -n1 | tr -d "\"'\r")"
          PROXY_NETWORK="${PROXY_NETWORK:-web-proxy}"
          docker network inspect "$PROXY_NETWORK" >/dev/null 2>&1 \
            || { echo "::error::Docker network '$PROXY_NETWORK' not found. Create it once: docker network create $PROXY_NETWORK"; exit 1; }
          $COMPOSE config --quiet

          mkdir -p backups

          # Healthy AND running the expected version, not just "some container with that name".
          wait_healthy() { # <expected version>
            for i in $(seq 1 30); do
              image="$(docker inspect -f '{{.Config.Image}}' wedding-yantra-api 2>/dev/null || echo missing)"
              status="$(docker inspect -f '{{.State.Health.Status}}' wedding-yantra-api 2>/dev/null || echo missing)"
              echo "health: $status, running: ${image##*:} ($i/30)"
              [ "$status" = "healthy" ] && [ "$image" = "wedding-yantra-api:$1" ] && return 0
              sleep 4
            done
            return 1
          }

          # Version currently running (image tag = commit SHA), used for rollback.
          PREV_IMAGE="$(docker inspect -f '{{.Config.Image}}' wedding-yantra-api 2>/dev/null || true)"
          PREV_VERSION="${PREV_IMAGE##*:}"
          echo "current version: ${PREV_VERSION:-none}  ->  new version: $APP_VERSION"

          # ---- Build first, while the current API keeps serving ---------------
          export APP_VERSION
          $COMPOSE build --pull wedding-yantra-api

          # ---- Backup right before rolling out (new migrations may run) -------
          if [ "$(docker inspect -f '{{.State.Running}}' wedding-yantra-backup 2>/dev/null || true)" = "true" ]; then
            $COMPOSE exec -T wedding-yantra-backup /bin/sh /scripts/backup.sh once \
              || { echo "::error::Pre-deploy backup failed; aborting before touching the running API"; exit 1; }
          else
            echo "backup container not running yet (first deploy); skipping pre-deploy backup"
          fi

          # ---- Roll out: recreates only containers whose image/config changed --
          # The DB is left running unless its definition changed.
          $COMPOSE up -d --remove-orphans

          # ---- Health gate with automatic rollback ----------------------------
          if ! wait_healthy "$APP_VERSION"; then
            echo "::error::New version ${APP_VERSION:0:7} did not become healthy"
            $COMPOSE logs --tail=100 wedding-yantra-api || true
            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$APP_VERSION" ] \
               && docker image inspect "wedding-yantra-api:$PREV_VERSION" >/dev/null 2>&1; then
              echo "::warning::Rolling back to ${PREV_VERSION:0:7}"
              APP_VERSION="$PREV_VERSION" $COMPOSE up -d --no-build wedding-yantra-api
              if wait_healthy "$PREV_VERSION"; then
                echo "::error::Deploy failed, rolled back: the API is running the previous version ${PREV_VERSION:0:7}. Fix the problem and push again."
              else
                echo "::error::Rollback to ${PREV_VERSION:0:7} is ALSO unhealthy; the API is down. Check the logs above."
              fi
            else
              echo "::error::No previous image available to roll back to."
            fi
            exit 1
          fi

          # ---- Bill photos: the API must be able to write to its uploads volume --
          if docker exec wedding-yantra-api sh -c 'f=/app/uploads/.wy-write-check; touch "$f" && rm -f "$f"'; then
            echo "uploads: writable"
          else
            echo "::warning::The API can't write to /app/uploads, so bill photos won't save. Fix the owner of the wedding-yantra-uploads volume (it should belong to uid 1000, the node user)."
          fi

          # ---- Housekeeping: only images built by THIS project ----------------
          # Keep the 3 newest API images (current + rollback targets), drop the rest.
          docker images wedding-yantra-api --format '{{.Repository}}:{{.Tag}}' \
            | tail -n +4 | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f --filter "label=com.weddingyantra.project=wedding-yantra" >/dev/null || true

          $COMPOSE ps
          echo "WY_DEPLOY_COMPLETE $APP_VERSION"
          }
          main </dev/null
          REMOTE
          grep -qx "WY_DEPLOY_COMPLETE ${APP_VERSION}" /tmp/deploy.log \
            || { echo "::error::The remote deploy script ended early without finishing; treat this deploy as NOT rolled out."; exit 1; }

      - name: Public smoke test (the new version must be live)
        run: |
          if [ -z "$API_PUBLIC_URL" ]; then
            echo "::notice::API_PUBLIC_URL variable not set; skipping the public smoke test."
            exit 0
          fi
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "${API_PUBLIC_URL%/}/api/health" || true)"
            if echo "$body" | jq -e --arg v "$GITHUB_SHA" '.data.version == $v and .data.status == "ok"' >/dev/null 2>&1; then
              echo "$body"; echo "Deploy OK: ${GITHUB_SHA:0:7} is live"; exit 0
            fi
            echo "not live yet (public API reports: $(echo "$body" | jq -r '.data.version // "no response"' 2>/dev/null | cut -c1-7))"
            sleep 5
          done
          echo "::error::The public API is not serving ${GITHUB_SHA:0:7}. Check the deploy log above and the reverse proxy route."
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
